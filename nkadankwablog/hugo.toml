baseURL = 'https://nkadankwa.github.io/blog/'
languageCode = 'en-us'
title = 'Nkadankwa Blog'
enableRobotsTXT = true
summaryLength = 28

[params]
  author = "Nkadankwa"
  tagline = "Build. Learn. Improve. Repeat."
  intro = "A personal blog about home labs, self-hosting, and figuring things out one project at a time."
  heroImage = "/images/first_step.jpg"
  description = "Experiments, lessons, and practical notes about home labs, self-hosting, Linux, automation, and learning in public."
  github = "https://github.com/nkadankwa"
  [params.newsletter]
    enabled = false # Set true only after adding a form action/provider.

[pagination]
  pagerSize = 10

[taxonomies]
  category = 'categories'
  tag = 'tags'
[menu]
  [[menu.main]]
    identifier = 'home'
    name = 'Home'
    url = '/'
    weight = 10
  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    url = '/posts/'
    weight = 20
  [[menu.main]]
    identifier = 'explore'
    name = 'Explore'
    url = '/explore/'
    weight = 40
