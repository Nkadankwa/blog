baseURL = 'https://nkadankwa.github.io/'
languageCode = 'en-us'
title = 'Nkadankwa Blog'
theme="Blonde" 
[params]
  author = "Nkadankwa"
  tagline = "Build. Learn. Improve. Repeat."
  intro = "A personal blog about home labs, self-hosting, and figuring things out one project at a time."
  heroImage = "/images/first_step.jpg"
  [params.newsletter]
    enabled = false # Set true only after adding a form action/provider.
  paginator_pages = 10
  mainSections = ['posts']
  base_color = "bg-gray-800"
  darkmode = "dark"

  [params.post]

    thumbnail = true
    noimage = true
    thumbnail_height = "h-48"
    thumbnail_width = "w-full" 
    description = "200"
  [params.widgets]
    display = true
    widgets = ["search", "category", "recent"]

[taxonomies]
  category = 'categories'
  tag = 'tags'
[menu]
  [[menu.main]]
    identifier = 'home'
    name = 'Home'
    url = '/'
    weight = 10
  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    url = '/posts/'
    weight = 20
  [[menu.main]]
    identifier = 'explore'
    name = 'Explore'
    url = '/explore/'
    weight = 40
