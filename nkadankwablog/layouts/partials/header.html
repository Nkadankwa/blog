<header class="site-header"><div class="shell nav">
  <a class="brand" href="{{ .Site.Home.RelPermalink }}"><span class="brand-mark">{{ .Site.Params.brandIcon | default "</>" }}</span><span>{{ .Site.Params.author | default .Site.Title }}</span></a>
  <button class="menu-button" aria-label="Toggle navigation" aria-expanded="false">☰</button>
  <nav class="menu">{{ range .Site.Menus.main }}<a class="{{ if $.IsMenuCurrent "main" . }}active{{ end }}" href="{{ .URL | relURL }}">{{ .Name }}</a>{{ end }}<a class="{{ if eq .RelPermalink ("about/" | relURL) }}active{{ end }}" href="{{ "about/" | relURL }}">About</a></nav>
  <button class="theme-toggle" aria-label="Use light theme" aria-pressed="false">☼</button>
</div></header>
<script>{const menuButton=document.querySelector('.menu-button'),themeButton=document.querySelector('.theme-toggle'),themeMeta=document.querySelector('meta[name="theme-color"]');menuButton?.addEventListener('click',e=>{const n=document.querySelector('.menu');n.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',n.classList.contains('open'))});function syncThemeControl(){const light=document.body.classList.contains('light');themeButton.setAttribute('aria-pressed',String(light));themeButton.setAttribute('aria-label',light?'Use dark theme':'Use light theme');themeMeta.content=light?'#eef5f6':'#07131b'}syncThemeControl();themeButton?.addEventListener('click',()=>{const light=document.body.classList.toggle('light');try{localStorage.setItem('nkadankwa-theme',light?'light':'dark')}catch(e){}syncThemeControl()})}</script>
