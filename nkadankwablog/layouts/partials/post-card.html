<article class="post-card" data-title="{{ .Title | lower }}" data-date="{{ .Date.Unix }}" data-taxonomy="{{ delimit (union (default (slice) .Params.categories) (default (slice) .Params.tags)) "," | lower }}"><a class="card-image" href="{{ .RelPermalink }}" {{ with .Params.image }}style="background-image:url('{{ . | relURL }}')"{{ end }}></a><div class="card-body"><div class="card-taxa">{{ range first 1 (default (slice) .Params.categories) }}{{ partial "taxonomy-pill.html" (dict "term" . "url" (printf "/categories/%s/" (. | urlize))) }}{{ end }}</div><time>{{ .Date.Format "Jan 2, 2006" }}</time><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p>{{ .Summary | plainify | truncate 135 }}</p><div class="meta">◷ {{ .ReadingTime }} min read <span>◯</span></div></div></article>
