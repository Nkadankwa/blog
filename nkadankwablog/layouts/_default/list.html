{{ define "main" }}<section class="shell listing"><p class="eyebrow">{{ .Site.Title }}</p><h1>{{ .Title }}</h1><div class="post-controls"><input id="post-search" type="search" placeholder="Search posts" aria-label="Search posts"><select id="post-filter"><option value="">All categories & tags</option>{{ range $name, $_ := .Site.Taxonomies.categories }}<option value="{{ $name | lower }}">Category: {{ $name }}</option>{{ end }}{{ range $name, $_ := .Site.Taxonomies.tags }}<option value="{{ $name | lower }}">Tag: {{ $name }}</option>{{ end }}</select><select id="post-sort" aria-label="Sort posts"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="az">Title A–Z</option></select></div><p class="results-count" aria-live="polite"></p><div class="archive-grid" id="post-results">{{ range .Pages.ByDate.Reverse }}{{ partial "post-card.html" . }}{{ end }}</div></section><script>const cards=[...document.querySelectorAll('#post-results .post-card')],search=document.querySelector('#post-search'),filter=document.querySelector('#post-filter'),sort=document.querySelector('#post-sort'),count=document.querySelector('.results-count'),box=document.querySelector('#post-results');function update(){let shown=cards.filter(c=>c.dataset.title.includes(search.value.toLowerCase())&&(!filter.value||c.dataset.taxonomy.includes(filter.value)));shown.sort((a,b)=>sort.value==='az'?a.dataset.title.localeCompare(b.dataset.title):sort.value==='old'?a.dataset.date-b.dataset.date:b.dataset.date-a.dataset.date);cards.forEach(c=>c.hidden=!shown.includes(c));shown.forEach(c=>box.append(c));count.textContent=`${shown.length} post${shown.length===1?'':'s'} found`}[search,filter,sort].forEach(e=>e.addEventListener('input',update));update();</script>{{ end }}
